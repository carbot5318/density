<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>El agua revela la densidad</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:linear-gradient(145deg,#e1f2f3,#eee4f8);color:#234653;font:16px/1.5 system-ui,sans-serif;padding:1rem}
main{width:min(340px,100%);text-align:center}form{background:#fff;border-radius:20px;padding:1.5rem;width:min(340px,100%);box-shadow:0 18px 50px #244e6230;text-align:center}
h1{font-size:1.25rem;margin:0 0 1rem}input,button{font:inherit;width:100%;min-height:44px;border-radius:10px;padding:.5rem .8rem}
input{border:1px solid #9bb3bd;margin-bottom:.7rem}button{border:0;background:#245d85;color:#fff;font-weight:600}p{min-height:1.5em;margin:.8rem 0 0}
</style>
<main><form id="unlock" hidden><h1>Vista previa protegida</h1><input id="password" type="password" aria-label="Contraseña" placeholder="Contraseña" autocomplete="current-password" required><button>Abrir</button></form>
<p id="status" role="status">Abriendo…</p></main>
<script>
(() => {
  const SALT = "Z+9VDTms3G97MNXZS7QL+w==", IV = "PZRBuoS9n0/r+a+z", ITERATIONS = 600000, KEY = "density-key-" + SALT;
  const form = document.getElementById("unlock"), status = document.getElementById("status");
  const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
  const download = fetch("density.bin").then(r => { if (!r.ok) throw new Error("download"); return r.arrayBuffer(); });
  async function derive(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: bytes(SALT), iterations: ITERATIONS}, base, 256);
  }
  async function unlock(raw) {
    status.textContent = "Abriendo\u2026";
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    let html;
    try { html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(IV)}, key, await download)); }
    catch (error) { if (error.message === "download") throw error; return false; }
    try { localStorage.setItem(KEY, btoa(String.fromCharCode(...new Uint8Array(raw)))); } catch {}
    document.open(); document.write(html); document.close();
    return true;
  }
  const ask = () => { form.hidden = false; status.textContent = ""; document.getElementById("password").focus(); };
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!await unlock(await derive(document.getElementById("password").value))) status.textContent = "Contrase\u00f1a incorrecta. Int\u00e9ntalo de nuevo.";
  });
  (async () => {
    const fromLink = new URLSearchParams(location.hash.slice(1)).get("pw");
    if (fromLink !== null) history.replaceState(null, "", location.pathname + location.search);
    if (fromLink && await unlock(await derive(fromLink))) return;
    let stored = null;
    try { stored = localStorage.getItem(KEY); } catch {}
    if (stored && await unlock(bytes(stored))) return;
    ask();
  })().catch(() => { status.textContent = "Could not load the page. Check the connection and reload."; });
})();
</script>
</html>
